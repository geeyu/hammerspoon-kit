<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>控制中心</title>
    <!-- 占位符：服务端展开注入 vue + theme.css + base.css + 组件（声明即可，勿手写 link/script）
     glass：玻璃光尘背景；toast：操作失败提示；empty/loading：空态/加载态；button：失败重试 -->
    <!-- hsutil:ui button,toast,empty,loading -->
    <!-- hsutil:fx glass -->
    <!-- 业务样式：页面私有（views/pages/control-center/style.css） -->
    <link
      rel="stylesheet"
      href="/control-center/view/pages/control-center/style.css"
    />
  </head>
  <body>
    <div id="app" v-cloak>
      <div class="cc-panel">
        <!-- 顶部标题栏 -->
        <div class="cc-head">
          <div class="cc-title-row">
            <div class="cc-title">🛠 控制中心</div>
            <span class="cc-count" v-if="!loading && !error && providers.length"
              >{{ providers.length }} 个组件</span
            >
          </div>
          <div class="cc-sub">点击功能块进入对应配置</div>
        </div>

        <!-- 加载态 -->
        <div class="cc-body" v-if="loading">
          <div class="cc-center">
            <ui-loading text="正在加载组件…"></ui-loading>
          </div>
        </div>

        <!-- 空态 -->
        <div class="cc-body" v-else-if="!error && providers.length === 0">
          <div class="cc-center">
            <ui-empty
              icon="inbox"
              text="暂无可用组件"
              hint="未在 Spoons/*.spoon 与 core/*/ 中发现配置入口"
            ></ui-empty>
          </div>
        </div>

        <!-- 失败态 -->
        <div class="cc-body" v-else-if="error">
          <div class="cc-center">
            <ui-empty icon="attention" text="加载失败" :hint="error"></ui-empty>
            <ui-button variant="ghost" size="sm" icon="refresh" @click="reload"
              >重试</ui-button
            >
          </div>
        </div>

        <!-- 功能块网格：双列大格子，每格 = 图标 + 名称 + 描述 + 入口 -->
        <div class="cc-body" v-else>
          <div class="cc-grid">
            <div
              class="cc-cell"
              v-for="p in providers"
              :key="p.name"
              :class="{ opening: opening === p.name }"
              @click="openProvider(p)"
            >
              <!-- 图标（emoji 或首字母徽标） -->
              <div class="cc-cell-icon">
                <span v-if="providerIcon(p)" class="cc-icon-emoji"
                  >{{ providerIcon(p) }}</span
                >
                <span v-else class="cc-icon-badge" :style="iconStyle(p)"
                  >{{ iconText(p) }}</span
                >
              </div>
              <!-- 文字区：名称 + 描述 + 入口提示 -->
              <div class="cc-cell-body">
                <div class="cc-cell-name">{{ displayName(p) }}</div>
                <div class="cc-cell-desc">{{ cardSummary(p) }}</div>
                <div class="cc-cell-action">
                  <span class="cc-cell-link">打开配置</span>
                  <span class="cc-cell-arrow">→</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 加载顺序（defer 按文档序）：store → app
     注意：占位符注入的 vue 为 defer，业务脚本必须 defer -->
    <script src="store.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
